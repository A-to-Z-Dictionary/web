# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# 전역 언어 설정 (제목, 요약, 본문 모두 한국어 사용)
language: "ko-KR"
enable_beta_features: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false

  # 모든 리뷰 응답(제목, 요약, 의견)을 한국어로 작성하도록 강제
  instructions: |
    - 모든 리뷰 내용, 요약문, 섹션 제목은 반드시 한국어로 작성하십시오.
    - 프로젝트의 핵심 규칙인 AGENTS.md 및 .agents/ 폴더의 컨벤션을 엄격히 준수하여 리뷰하십시오.
    - 특히 단일 책임 원칙(SRP)과 WebView 최적화 가이드라인을 중점적으로 검토하십시오.

  # 폴더별 상세 검토 지침 (SRP 및 WebView 컨벤션 반영)
  path_instructions:
    - path: "src/actions/**/*.ts"
      instructions: "Server Actions는 [.agents/code-convention/SRP_CONVENTION.md]에 따라 데이터 변경(Mutation), DB 접근만 담당해야 합니다. 성공/실패 시 일관된 포맷을 반환하는지 확인하세요."
    - path: "src/app/**/*.tsx"
      instructions: |
        - 라우팅 entry point이자 Server Components로서 데이터 페칭에 집중해야 합니다. 
        - 모바일 WebView 환경이므로 [.agents/design-convention/SKILLS.md]의 Safe Area 관리 및 레이아웃 규칙을 준수하는지 확인하세요.
    - path: "src/components/**/*.tsx"
      instructions: |
        - UI 렌더링에 집중해야 하며, 복잡한 로직은 hooks로 위임했는지 확인하세요.
        - WebView 최적화 규칙에 따라 Hover 스타일 사용을 지양하고 active 피드백을 사용했는지, 텍스트 선택 방지(select-none)가 적용되었는지 검토하세요.
    - path: "src/hooks/**/*.ts"
      instructions: "TanStack Query 사용 시 쿼리 키 구조와 enabled 조건, null 가드 로직이 [.agents/code-convention/SRP_CONVENTION.md]의 관심사 분리 원칙에 부합하는지 확인하세요."
    - path: "src/hooks/**/*.tsx"
      instructions: "TanStack Query 사용 시 쿼리 키 구조와 enabled 조건, null 가드 로직이 [.agents/code-convention/SRP_CONVENTION.md]의 관심사 분리 원칙에 부합하는지 확인하세요."
    - path: "src/lib/**/*.ts"
      instructions: "외부 라이브러리(Supabase, Zod 등)의 설정 및 초기화 로직이 위치해야 합니다. 비즈니스 로직은 utils로 분리하세요."
    - path: "src/utils/**/*.ts"
      instructions: "특정 도메인에 특화된 순수 함수 및 비즈니스 로직 유틸리티인지 확인하세요."
    - path: "supabase/migrations/**/*.sql"
      instructions: "[.agents/supabase-convention/SKILLS.md]에 따라 인덱싱, RLS 정책(한국어 서술형), N+1 방지, 트랜잭션 처리가 올바른지 중점적으로 검토하세요."

  # 리뷰 제외 대상
  path_filters:
    - "!node_modules/**"
    - "!package-lock.json"
    - "!.next/**"
    - "!public/**"

# 프로젝트 내 모든 컨벤션 파일 학습
knowledge_base:
  code_guidelines:
    enabled: true
    file_patterns:
      - "AGENTS.md"
      - "GEMINI.md"
      - "CODEX.md"
      - ".agents/code-convention/*.md"
      - ".agents/design-convention/*.md"
      - ".agents/git-convention/*.md"
      - ".agents/supabase-convention/*.md"
      - ".agents/log-convention/*.md"
      - ".agents/plan-convention/*.md"
      - ".agents/business-strategy/*.md"
      - "README.md"

chat:
  auto_reply: true

tools:
  shellcheck:
    enabled: true
  ast-grep:
    enabled: true

issue_enrichment:
  enabled: true
